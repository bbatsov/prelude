name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  load-test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.1"
          - "29.4"
          - "30.2"
          - "31.1"
          - "snapshot"
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: set up Prelude
        run: |
          ln -s $(pwd) $HOME/.emacs.d
          mkdir -p personal
          echo '(provide (quote prelude-modules))' > personal/prelude-modules.el
      - name: load core
        run: emacs --batch --load init.el
      - name: load all modules
        run: emacs --batch --load init.el --load test/prelude-load-test.el
      - name: run regression tests
        run: emacs --batch --load init.el --load test/prelude-test.el -f ert-run-tests-batch-and-exit
      # Obsolescence warnings differ between Emacs versions (a name that's
      # obsolete in one may be the only one available in another), so the
      # warnings-as-errors build only runs on the latest stable release.
      - name: byte-compile with warnings as errors
        if: matrix.emacs_version == '31.1'
        run: emacs --batch --load init.el --load test/prelude-compile-test.el
      - name: load personal early-init once, before core
        run: |
          printf '%s\n' "(defvar prelude-test-early-init-loads nil)" "(push (featurep 'prelude-core) prelude-test-early-init-loads)" > personal/early-init.el
          emacs --batch --load early-init.el --load init.el \
            --eval "(unless (equal prelude-test-early-init-loads (list nil)) (error \"Expected one load before core, got %S\" prelude-test-early-init-loads))"
      - name: load everything with smartparens disabled
        run: |
          echo "(setq prelude-smartparens nil)" > personal/preload/no-smartparens.el
          emacs --batch --load init.el \
            --eval "(progn (require 'prelude-emacs-lisp) (require 'ielm) (with-temp-buffer (emacs-lisp-mode) (when (bound-and-true-p smartparens-mode) (error \"smartparens-mode is on\"))))"
          emacs --batch --load init.el --load test/prelude-load-test.el
          rm personal/preload/no-smartparens.el
      - name: keep startup lazy
        run: |
          emacs --batch --load init.el --load sample/prelude-modules.el \
            --eval "(let ((loaded (seq-filter #'featurep '(tramp calc eglot ert cperl-mode sh-script nxml-mode exec-path-from-shell crux operate-on-number)))) (when loaded (error \"Loaded at startup: %S\" loaded)))"
