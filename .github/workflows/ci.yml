name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Prelude installs the latest versions of its packages, so things can
  # break without a single commit here.
  schedule:
    - cron: "0 5 * * 1"
jobs:
  load-test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.1"
          - "29.4"
          - "30.2"
          - "31.1"
          - "snapshot"
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: set up Prelude
        run: |
          ln -s $(pwd) $HOME/.emacs.d
          mkdir -p personal
          echo '(provide (quote prelude-modules))' > personal/prelude-modules.el
      - name: load core
        run: emacs --batch --load init.el
      - name: load all modules
        run: emacs --batch --load init.el --load test/prelude-load-test.el
      - name: run regression tests
        run: emacs --batch --load init.el --load test/prelude-test.el -f ert-run-tests-batch-and-exit
      - name: run the installer against throwaway home directories
        run: sh test/prelude-installer-test.sh
      # Obsolescence warnings differ between Emacs versions (a name that's
      # obsolete in one may be the only one available in another), so the
      # warnings-as-errors build only runs on the latest stable release.
      - name: byte-compile with warnings as errors
        if: matrix.emacs_version == '31.1'
        run: emacs --batch --load init.el --load test/prelude-compile-test.el
      - name: load everything with lsp-mode as the LSP client
        run: |
          echo "(setq prelude-lsp-client 'lsp-mode)" > personal/preload/lsp-mode.el
          emacs --batch --load init.el --load test/prelude-load-test.el
          emacs --batch --load init.el --load test/prelude-test.el -f ert-run-tests-batch-and-exit
      - name: switch back to Eglot
        if: always()
        run: rm -f personal/preload/lsp-mode.el
      # These are left out of the load test, as they don't mix with the
      # modules it loads (or with each other).
      - name: load the modules that have to be loaded on their own
        run: |
          for module in prelude-ido prelude-ivy prelude-helm-everywhere prelude-evil prelude-key-chord prelude-erc; do
            emacs --batch --load init.el --eval "(require '$module)"
          done
      - name: load personal early-init once, before core
        run: |
          printf '%s\n' ";;; -*- lexical-binding: t -*-" "(defvar prelude-test-early-init-loads nil)" "(push (featurep 'prelude-core) prelude-test-early-init-loads)" > personal/early-init.el
          emacs --batch --load early-init.el --load init.el \
            --eval "(unless (equal prelude-test-early-init-loads (list nil)) (error \"Expected one load before core, got %S\" prelude-test-early-init-loads))"
      - name: load everything with smartparens disabled
        run: |
          echo "(setq prelude-smartparens nil)" > personal/preload/no-smartparens.el
          emacs --batch --load init.el \
            --eval "(progn (require 'prelude-emacs-lisp) (require 'ielm) (with-temp-buffer (emacs-lisp-mode) (when (bound-and-true-p smartparens-mode) (error \"smartparens-mode is on\"))))"
          emacs --batch --load init.el --load test/prelude-load-test.el
          rm personal/preload/no-smartparens.el
      - name: keep startup lazy
        run: |
          emacs --batch --load init.el --load sample/prelude-modules.el \
            --eval "(let ((loaded (seq-filter #'featurep '(tramp calc eglot ert cperl-mode sh-script nxml-mode exec-path-from-shell crux operate-on-number)))) (when loaded (error \"Loaded at startup: %S\" loaded)))"
      # Batch mode skips a part of the startup and has no *Warnings*
      # buffer to shove in the user's face, so this starts a daemon.
      - name: start a real session with the default modules
        run: |
          cp sample/prelude-modules.el personal/prelude-modules.el
          sh test/prelude-startup-test.sh
      - name: go back to an empty modules file
        if: always()
        run: echo '(provide (quote prelude-modules))' > personal/prelude-modules.el
      # A tree-sitter mode only works with the versions of its grammar
      # it was written for, and those differ between Emacs releases.
      # This goes last, as the grammars it installs would change what
      # the other steps test.
      - name: check the tree-sitter grammars
        run: emacs --batch --load init.el --load test/prelude-grammar-test.el

  # The whole chain a user depends on for LSP: the module's hook,
  # prelude-lsp-enable, Eglot's choice of a server and a real server.
  lsp-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.1"
          - "31.1"
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: set up Prelude
        run: |
          ln -s $(pwd) $HOME/.emacs.d
          mkdir -p personal
          echo '(provide (quote prelude-modules))' > personal/prelude-modules.el
      - name: install language servers
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install python-lsp-server
          npm install -g bash-language-server yaml-language-server vscode-langservers-extracted
      - name: connect to the language servers
        env:
          PRELUDE_LSP_TEST_SERVERS: >-
            clangd gopls pylsp bash-language-server yaml-language-server
            vscode-css-language-server vscode-json-language-server
        run: emacs --batch --load init.el --load test/prelude-lsp-test.el

  # Prelude has code that only runs on macOS (core/prelude-macos.el).
  macos:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - name: set up Prelude
        run: |
          ln -s $(pwd) $HOME/.emacs.d
          mkdir -p personal
          echo '(provide (quote prelude-modules))' > personal/prelude-modules.el
      - name: load core
        run: emacs --batch --load init.el
      - name: load all modules
        run: emacs --batch --load init.el --load test/prelude-load-test.el
      - name: run regression tests
        run: emacs --batch --load init.el --load test/prelude-test.el -f ert-run-tests-batch-and-exit
      - name: run the installer against throwaway home directories
        run: sh test/prelude-installer-test.sh
